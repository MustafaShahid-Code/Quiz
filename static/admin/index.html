<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="/static/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
<link rel="alternate icon" href="/static/brand/favicon.ico">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
<link rel="manifest" href="/static/brand/site.webmanifest">
<meta name="theme-color" content="#4F6BFF">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="login" class="login split" hidden>
  <aside class="login-brand">
    <div class="lb-top"><img id="loginLogo" alt="" hidden><span id="loginBrandName"></span></div>
    <div class="lb-mid">
      <h2 id="loginClient"></h2>
      <ul id="loginFeatures"></ul>
    </div>
    <div class="lb-foot" id="loginFooter"></div>
  </aside>
  <main class="login-main">
    <form id="loginForm" class="login-card" autocomplete="on">
      <img id="loginLogoSmall" alt="" hidden>
      <h1 id="loginTitle">Welcome back</h1>
      <p class="muted" id="loginSub">Sign in to manage the game</p>
      <label>Username
        <span class="inp"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <input name="username" autocomplete="username" required autofocus placeholder="Username"></span></label>
      <label>Password
        <span class="inp"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input name="password" type="password" autocomplete="current-password" required placeholder="Password">
        <button type="button" id="pwToggle" class="eye" aria-label="Show password" tabindex="-1">Show</button></span></label>
      <div id="capsHint" class="hint" hidden>Caps Lock is on</div>
      <div id="loginError" class="error" hidden></div>
      <button class="btn primary big" type="submit" id="loginBtn">Sign in</button>
      <div class="login-foot-small" id="loginFooterSmall"></div>
    </form>
  </main>
</div>

<div id="app" hidden>
  <aside id="sidebar">
    <div class="brand"><img id="brandLogo" alt="" hidden><span id="brandName">Admin</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="who" class="muted"></div>
      <button class="btn small ghost" id="pwBtn" type="button">Change password</button>
      <button class="btn small ghost" id="logoutBtn" type="button">Sign out</button>
      <a class="btn small ghost" href="/game/" target="_blank" rel="noopener">Open game ↗</a>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>
<script src="core.js"></script>
<script src="pages-games.js"></script>
<script src="pages-content.js"></script>
<script src="pages-brand.js"></script>
<script src="pages-system.js"></script>
<script src="boot.js"></script>
</body>
</html>
